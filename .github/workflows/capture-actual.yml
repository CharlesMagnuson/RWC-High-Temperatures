name: Capture actual
# PRIMARY TRIGGER (since 2026-08-28): the `gha-cron` Cloudflare Worker
# (~/Developer/gha-cron) fires workflow_dispatch at exactly 16:30 Pacific,
# resolving DST itself. GitHub's scheduler had degraded to 7-11 hour delays
# (8/27: fired 06:48 UTC the next day). The cron below is a FALLBACK only:
# 00:30 UTC is 16:30 PST / 17:30 PDT, never earlier than the Worker in either
# regime, and a re-capture is harmless (max over the day). The afternoon
# guard applies only to schedule events; the Worker's dispatch runs
# unconditionally.
on:
  schedule:
    - cron: '30 0 * * *' # 16:30 PST / 17:30 PDT
  workflow_dispatch:

concurrency:
  group: data-commits
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      # Fallback schedule events only (the Worker's workflow_dispatch skips
      # this). Accepts 16:00-23:59 Pacific: the daily high never happens after
      # 16:00 here, so a delayed fallback (GitHub delivers scheduled runs hours
      # late) still records the correct daily high. Anything delayed past
      # midnight is skipped (wrong date).
      - name: Afternoon guard (16:00-23:59 Pacific)
        id: guard
        run: |
          H=$(TZ=America/Los_Angeles date +%H)
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$H" -lt 16 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Skipping: Pacific hour is $H"
          fi
      - uses: actions/checkout@v7
        if: steps.guard.outputs.skip != 'true'
      - uses: actions/setup-node@v6
        if: steps.guard.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.guard.outputs.skip != 'true'
      - run: npm run capture:actual
        if: steps.guard.outputs.skip != 'true'
        env:
          NETATMO_CLIENT_ID: ${{ secrets.NETATMO_CLIENT_ID }}
          NETATMO_CLIENT_SECRET: ${{ secrets.NETATMO_CLIENT_SECRET }}
          NETATMO_ENC_PASSPHRASE: ${{ secrets.NETATMO_ENC_PASSPHRASE }}
          NETATMO_DEVICE_ID: ${{ secrets.NETATMO_DEVICE_ID }}
          NETATMO_MODULE_ID: ${{ secrets.NETATMO_MODULE_ID }}
      - name: Commit rotated token even on failure
        if: always() && steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "temperature-bot"
          git config user.email "github-actions@users.noreply.github.com"
          git add secrets/netatmo-tokens.enc
          git diff --cached --quiet && exit 0
          git commit -m "chore: rotate netatmo token"
          git pull --rebase --autostash
          git push
      - name: Commit data
        if: success() && steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "temperature-bot"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/temperatures.json
          git diff --cached --quiet && exit 0
          git commit -m "data: actual $(TZ=America/Los_Angeles date +%F)"
          git pull --rebase --autostash
          git push
      # Dead-man's switch: healthchecks.io (high-temp-actual) expects this ping on
      # schedule (+1h grace) and emails if it is missing or /fail arrives.
      # Guard-skipped fallback runs do not ping: a skip must not mask a
      # missed capture.
      - name: Healthcheck ping
        if: success() && steps.guard.outputs.skip != 'true'
        run: curl -fsS -m 10 --retry 3 -o /dev/null "https://hc-ping.com/${{ secrets.HC_PING_KEY }}/high-temp-actual"
      - name: Healthcheck fail
        if: failure() && steps.guard.outputs.skip != 'true'
        run: curl -fsS -m 10 --retry 3 -o /dev/null "https://hc-ping.com/${{ secrets.HC_PING_KEY }}/high-temp-actual/fail"
