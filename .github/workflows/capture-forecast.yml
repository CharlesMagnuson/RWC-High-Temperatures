name: Capture forecast
# PRIMARY TRIGGER (since 2026-08-28): the `gha-cron` Cloudflare Worker
# (~/Developer/gha-cron) fires workflow_dispatch at exactly 00:00 Pacific,
# resolving DST itself, so the record is the forecast as it stood at the
# start of the target day. GitHub's own scheduler had degraded to 7-11 hour
# delays (8/27: both old 21:05 crons fired ~15:00-16:00 UTC, i.e. 8-9am
# Pacific -- a next-morning forecast is not a start-of-day forecast).
#
# The cron below is a FALLBACK only. First capture wins, so it must never
# be able to fire BEFORE the Worker: 08:00 UTC is 00:00 PST / 01:00 PDT,
# never pre-midnight in either regime (a 07:00 UTC cron would be 23:00 PST
# in winter and would pre-empt the midnight capture). The evening guard
# applies only to schedule events; the Worker's dispatch runs unconditionally.
on:
  schedule:
    - cron: '0 8 * * *' # 00:00 PST / 01:00 PDT; delayed firings land in the guard's skip window
  workflow_dispatch:

concurrency:
  group: data-commits
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      # Fallback schedule events only (the Worker's workflow_dispatch skips
      # this). Accepts 00:00-06:59 Pacific: the capture is idempotent by
      # target day, so if the Worker already captured at midnight this is a
      # no-op, and if it didn't, an early-morning capture is still the
      # start-of-day forecast. Anything later (GitHub delivers scheduled runs
      # hours late) is skipped: a mid-morning forecast is a different forecast,
      # and forecasts cannot be backfilled, so a gap beats a wrong value.
      # Pre-midnight (21-23) is also skipped -- from 21:00 the script targets
      # tomorrow and, first capture winning, would pre-empt the midnight run.
      - name: Overnight guard (00:00-06:59 Pacific)
        id: guard
        run: |
          H=$(TZ=America/Los_Angeles date +%H)
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$H" -ge 7 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Skipping: Pacific hour is $H"
          fi
      - uses: actions/checkout@v7
        if: steps.guard.outputs.skip != 'true'
      - uses: actions/setup-node@v6
        if: steps.guard.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.guard.outputs.skip != 'true'
      - run: npm run capture:forecast
        if: steps.guard.outputs.skip != 'true'
      - name: Upload raw page on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: wu-forecast-html
          path: artifacts/wu-forecast.html
          retention-days: 7
      - name: Commit data
        if: success() && steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "temperature-bot"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/temperatures.json
          git diff --cached --quiet && exit 0
          # From 21:00 the record is for tomorrow (mirrors pacificForecastTargetISO).
          H=$(TZ=America/Los_Angeles date +%H)
          if [ "$H" -ge 21 ]; then D=$(TZ=America/Los_Angeles date -d tomorrow +%F); else D=$(TZ=America/Los_Angeles date +%F); fi
          git commit -m "data: forecast $D"
          git pull --rebase --autostash
          git push
      # Dead-man's switch: healthchecks.io (high-temp-forecast) expects this ping on
      # schedule (+1h grace) and emails if it is missing or /fail arrives.
      # Guard-skipped fallback runs do not ping: a skip must not mask a
      # missed capture.
      - name: Healthcheck ping
        if: success() && steps.guard.outputs.skip != 'true'
        run: curl -fsS -m 10 --retry 3 -o /dev/null "https://hc-ping.com/${{ secrets.HC_PING_KEY }}/high-temp-forecast"
      - name: Healthcheck fail
        if: failure() && steps.guard.outputs.skip != 'true'
        run: curl -fsS -m 10 --retry 3 -o /dev/null "https://hc-ping.com/${{ secrets.HC_PING_KEY }}/high-temp-forecast/fail"
